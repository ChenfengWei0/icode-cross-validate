[project]
name = "icode-cross-validate"
version = "2.0.0"
description = "Cross validation (交叉验证) for iCode: controlled propositions from the requirement, bound to the code, judged into a credibility report"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []  # the workflow uses the standard library only: iCode installs nothing for workflows

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The rule set and line length of openJiuwen/iCode's own pyproject.toml (STANDARDS.md P-PY-1).
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["cross-validate", "tests", "scripts", "."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "ISC", "RET", "C4", "PIE", "PERF", "T20", "FURB",
    "DTZ", "PLW", "TID",
]
ignore = [
    "E501",     # line length handled by formatter (as in iCode)
    "RET504",   # unnecessary variable before return (as in iCode)
    "S104",     # binding 0.0.0.0 (as in iCode)
    "S105",     # false positives on names such as "pass" (as in iCode)
    "S108",     # hardcoded /tmp path (as in iCode)
    "S110",     # try-except-pass (as in iCode)
    "ASYNC109", # (as in iCode)
    "ASYNC240", # (as in iCode)
    "PLW0603",  # global statement (as in iCode)
    "PLW2901",  # loop variable overwrite (as in iCode)
    "RUF001",   # Chinese full-width punctuation in strings is intended: the reports are written in Chinese
    "RUF002",   # the same, in docstrings
    "RUF003",   # the same, in comments
]

[tool.ruff.lint.per-file-ignores]
# The checker, the launcher and the snapshot run programs as subprocesses (as iCode's shell tool).
"cross-validate/cv_run.py" = ["S603", "S607"]
"cross-validate/cv_flow.py" = ["S603", "S607"]
"cv_cli.py" = ["S603", "S607", "T20"]
# Tests use assert and run subprocess-backed code.
"tests/*" = ["S101", "S603", "S607"]
# The conformance checker prints its report and runs the tools it checks with.
"scripts/*" = ["T20", "S603", "S607"]
# The example's checks are scripts written by an alignment agent.
"examples/*" = ["T20", "S311", "S603", "S607"]
